# Template: run scripts/setup_local.py to generate absolute native Windows paths.
# Tested config family: Eclipse Mosquitto 2.0 / 2.1.
listener 1883 127.0.0.1
allow_anonymous false
password_file .runtime/mqtt/passwords
acl_file mqtt/acl.example
persistence true
persistence_location .runtime/mqtt/
max_queued_messages 100
max_inflight_messages 20
message_size_limit 8192
log_dest stdout
log_type error
log_type warning
log_type notice
# LAN: change listener binding after configuring credentials and firewall.
# TLS: use listener 8883 with cafile, certfile and keyfile; see deployment guide.
